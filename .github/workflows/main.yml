name: Build Controllable for Forge 1.20.1

on:
  push:
    branches:
      - mc1.20.1-jei-fix
      - codex/build-forge-1.20.1
  pull_request:
    branches:
      - mc1.20.1-jei-fix
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GPR_TOKEN || github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Forge mod
        run: ./gradlew --no-daemon :forge:build -Pforge_version=47.4.23

      - name: Upload installable Forge JAR
        uses: actions/upload-artifact@v6
        with:
          name: controllable-forge-1.20.1-${{ github.sha }}
          path: forge/build/libs/*-release.jar
          if-no-files-found: error
          retention-days: 30
